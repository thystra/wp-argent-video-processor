name: Build tagged release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate semantic version tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "${TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?)$ ]]; then
            echo "Unsupported tag: ${TAG}" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes rsync zip unzip

      - name: PHP syntax check
        run: find . -type f -name '*.php' -not -path './dist/*' -print0 | sort -z | xargs -0 -n1 php -l

      - name: Run dependency-free tests
        run: |
          php tests/run.php
          php tests/smoke-load.php

      - name: Check whitespace errors
        run: git diff --check

      - name: Build release package
        run: bash build/build-plugin.sh '${{ steps.version.outputs.version }}'

      - name: Verify release contents
        shell: bash
        run: |
          set -euo pipefail
          ZIP="dist/wp-argent-video-processor-${{ steps.version.outputs.version }}.zip"
          test -f "${ZIP}"
          test "$(unzip -Z1 "${ZIP}" | awk -F/ 'NF {print $1}' | sort -u)" = 'wp-argent-video-processor'
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP="dist/wp-argent-video-processor-${{ steps.version.outputs.version }}.zip"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${ZIP}" dist/SHA256SUMS --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${ZIP}" dist/SHA256SUMS \
              --verify-tag \
              --generate-notes \
              --title "Argent Video Processor ${{ steps.version.outputs.version }}"
          fi

# EOF: /home/alan/src/wp-argent-video-processor/.github/workflows/release.yml
